kind = "mobile"
previewPath = "/car-wash-mobile/"
title = "WashPro Mobile"
version = "1.0.0"
id = "artifacts/car-wash-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 22282
name = "expo"
paths = ["/car-wash-mobile/"]

[services.development]
run = "pnpm --filter @workspace/car-wash-mobile run dev"

[services.env]
PORT = "22282"
BASE_PATH = "/car-wash-mobile/"

[services.production]
build = ["pnpm", "--filter", "@workspace/car-wash-mobile", "run", "build"]
run = ["pnpm", "--filter", "@workspace/car-wash-mobile", "run", "serve"]
