name: Sweep — self-heal stale bookings

# Periodically pokes the backend's self-healing sweep so it runs even though
# Render's free tier sleeps and drops in-process timers. The sweep:
#   • cancels "searching" bookings that never found a cleaner (backup for the timer)
#   • reassigns "accepted" bookings whose cleaner went offline before arriving
# Side benefit: the request also wakes the sleeping Render service.
#
# GitHub's shortest cron interval is 5 min and can be delayed under load — that's
# fine for this use case. Can also be run manually via workflow_dispatch.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call sweep endpoint
        env:
          SWEEP_TOKEN: ${{ secrets.SWEEP_TOKEN }}
        run: |
          BASE="https://carcleanpro-api.onrender.com"
          # Render's free tier spins the service down after ~15 min idle; a cold start can
          # take 60-90s. Wake it first (ignore the result), then call the sweep with a
          # generous timeout and a few retries so a single cold start doesn't fail the run
          # (and spam failure emails). We only fail — and alert — if every attempt fails.
          echo "Warming service..."
          curl -s -o /dev/null --max-time 150 "$BASE/api/healthz" || true
          for attempt in 1 2 3; do
            resp=$(curl -s -X POST "$BASE/api/internal/sweep" \
              -H "x-sweep-token: $SWEEP_TOKEN" -H "Content-Type: application/json" \
              -w "\n%{http_code}" --max-time 150)
            status=$(echo "$resp" | tail -n1)
            body=$(echo "$resp" | sed '$d')
            echo "attempt $attempt -> HTTP $status"
            echo "$body"
            [ "$status" = "200" ] && exit 0
            echo "retrying in 20s..."
            sleep 20
          done
          echo "sweep failed after 3 attempts"
          exit 1
