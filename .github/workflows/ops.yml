name: Ops — API troubleshooting (no UI)

# Troubleshoot Render + Expo + Neon from ANY device, no dashboards, using the
# repo's encrypted secrets. Pure API (curl) — no dependency installs.
#
#   Trigger:  gh workflow run ops.yml -f action=status
#   Read it:  gh run list --workflow ops.yml -L1   then   gh run view <id> --log
#
# actions: status | render-service | render-deploys | render-logs | expo-builds | neon-status

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to check"
        required: true
        default: status
        type: choice
        options:
          - status
          - render-service
          - render-deploys
          - render-logs
          - expo-builds
          - neon-status
      limit:
        description: "How many rows / log lines"
        required: false
        default: "10"

env:
  RENDER_SERVICE: srv-d9kr4fijnfac739oerk0
  EAS_PROJECT_ID: d4b8d786-3cf7-4a02-acbf-d9405f07ce48

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Render — service info
        if: ${{ inputs.action == 'render-service' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +e
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE" \
            | jq '{name, type, suspended, dashboardUrl}'

      - name: Render — recent deploys
        if: ${{ inputs.action == 'render-deploys' || inputs.action == 'status' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +e
          echo "### Render — recent deploys"
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE/deploys?limit=${{ inputs.limit }}" \
            | jq -r '.[].deploy | "\(.finishedAt // .createdAt)  [\(.status)]  \(.commit.message | split("\n")[0])"'

      - name: Render — recent logs
        if: ${{ inputs.action == 'render-logs' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +e
          OWNER=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE" | jq -r '.ownerId')
          echo "### Render — logs (owner=$OWNER)"
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/logs?ownerId=$OWNER&resource[]=$RENDER_SERVICE&limit=${{ inputs.limit }}" \
            | jq -r '(.logs // [])[]? | "\(.timestamp)  \(.message)"'
          echo "(if empty: free-plan log retention is limited)"

      - name: Expo — recent builds (direct API)
        if: ${{ inputs.action == 'expo-builds' || inputs.action == 'status' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          echo "### Expo — recent Android builds"
          Q='query { app { byId(appId: "'"$EAS_PROJECT_ID"'") { builds(offset: 0, limit: '"${{ inputs.limit }}"') { id status platform appVersion gitCommitHash createdAt } } } }'
          PAYLOAD=$(jq -n --arg q "$Q" '{query:$q}')
          curl -s -X POST https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            | jq -r 'if .errors then ("Expo API error: " + (.errors | map(.message) | join("; "))) else (.data.app.byId.builds[]? | "\(.createdAt)  [\(.status)]  \(.platform)  v\(.appVersion // "?")  \((.gitCommitHash // "")[0:7])") end'

      - name: Neon — status (projects/branches)
        if: ${{ inputs.action == 'neon-status' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set +e
          if [ -z "$NEON_API_KEY" ]; then echo "NEON_API_KEY secret not set — skipping."; exit 0; fi
          echo "### Neon — projects"
          curl -s -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects" \
            | jq -r '(.projects // [])[] | "\(.name)  id=\(.id)  region=\(.region_id)  created=\(.created_at)"'
